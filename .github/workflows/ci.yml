name: CI

# Runs on every pull request and on pushes to main (the latter also archives the
# final WAR). Two sequential jobs keep feedback fast: unit tests + ArchUnit first
# (no Docker), then the Testcontainers integration tests only if those pass.
on:
  pull_request:
  push:
    branches:
      - main

# Cancel a superseded run of the same PR/branch instead of queueing it behind.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-archunit:
    name: Unit tests + ArchUnit + WAR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # *Test (not *IT) keeps this job free of Testcontainers; the glob also
      # picks up every module's *HexagonalArchitectureTest, so ArchUnit is part
      # of the fast gate. -DfailIfNoTests=false + -Dsurefire.failIfNoSpecifiedTests=false
      # tolerate modules without matching tests (e.g. shared-kernel, web).
      - name: Unit tests + ArchUnit (no Testcontainers)
        run: mvn -B -ntp test -Dtest='*Test' -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false

      # AGENTS.md rule #4: 100% jakarta.*, zero javax.*. ArchUnit guards the
      # domain/application boundaries; this grep catches any javax.* import in
      # the main sources of every module.
      - name: Reject lingering javax.* imports
        run: |
          if grep -rn "javax\." --include="*.java" */src/main 2>/dev/null; then
            echo "::error::javax.* imports found in main sources — migrate to jakarta.* (AGENTS.md rule #4)"
            exit 1
          fi
          echo "No javax.* imports found in main sources."

      # Validate the final packaging (web.xml, taglib, design tokens) without
      # re-running the tests. Test classes are skipped for speed.
      - name: Build the WAR
        run: mvn -B -ntp package -pl web -am -Dmaven.test.skip=true

      - name: Archive the WAR (main only)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: web.war
          path: web/target/web.war
          if-no-files-found: error

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-unit
          path: '**/target/surefire-reports/**'

  integration-tests:
    name: Integration tests (Testcontainers)
    needs: unit-and-archunit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # *IT runs the Testcontainers suites (Postgres 15 + LocalStack). Ubuntu
      # runners provide Docker; testcontainers.reuse stays off, so every run is
      # a clean environment. The -Dapi.version=1.44 argLine already lives in the
      # modules' surefire configs, keeping docker-java compatible with modern
      # Docker Desktop/Engine API versions.
      - name: Integration tests
        run: mvn -B -ntp test -Dtest='*IT' -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-it
          path: '**/target/surefire-reports/**'
