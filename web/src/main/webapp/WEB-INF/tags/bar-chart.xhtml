<ui:composition
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:ui="jakarta.faces.facelets"
  xmlns:cc="http://java.sun.com/jsf/composite"
>
  <cc:interface>
    <cc:attribute name="bars" required="true" />
  </cc:interface>

  <cc:implementation>
    <div class="chart">
      <ui:repeat value="#{cc.attrs.bars}" var="bar">
        <div class="chart-col">
          <div class="chart-track">
            <div
              class="chart-fill"
              style="height: #{bar.height}%"
              title="#{bar.title}"
            ></div>
          </div>
          <div class="chart-label">#{bar.label}</div>
        </div>
      </ui:repeat>
    </div>
  </cc:implementation>
</ui:composition>
