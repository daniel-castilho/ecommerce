<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets">
    <div class="chart">
        <ui:repeat value="#{bars}" var="bar">
            <div class="chart-col">
                <div class="chart-track">
                    <div
                        class="chart-fill"
                        style="height: #{bar.height}%"
                        title="#{bar.title}"
                    ></div>
                </div>
                <div class="chart-label">#{bar.label}</div>
            </div>
        </ui:repeat>
    </div>
</ui:composition>
