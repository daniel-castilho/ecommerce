<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:my="https://loja.com/design-system"
                template="/WEB-INF/templates/main.xhtml">

    <ui:define name="title">Admin - Users</ui:define>

    <ui:define name="content">
        <h1 class="page-title">User Management</h1>
        <h:messages globalOnly="true" styleClass="messages" />

        <div class="card">
            <h:form id="filterForm">
                <div class="form-grid">
                    <h:outputLabel for="emailFilter" value="Email" />
                    <h:inputText id="emailFilter" value="#{adminUsersBean.emailFilter}" />

                    <h:outputLabel for="statusFilter" value="Status" />
                    <h:selectOneMenu id="statusFilter" value="#{adminUsersBean.statusFilter}">
                        <f:selectItem itemValue="#{null}" itemLabel="All" />
                        <f:selectItems value="#{adminUsersBean.availableStatuses}" />
                    </h:selectOneMenu>
                </div>
                <h:commandButton value="Search" action="#{adminUsersBean.search}" styleClass="button" />
            </h:form>
        </div>

        <div class="card">
            <h:dataTable value="#{adminUsersBean.users}" var="user"
                         styleClass="data-table"
                         rendered="#{not empty adminUsersBean.users}">
                <h:column>
                    <f:facet name="header">Email</f:facet>
                    #{user.email.value}
                </h:column>
                <h:column>
                    <f:facet name="header">Name</f:facet>
                    #{user.fullName}
                </h:column>
                <h:column>
                    <f:facet name="header">Status</f:facet>
                    <my:statusBadge status="#{user.status}" />
                </h:column>
                <h:column>
                    <f:facet name="header">Roles</f:facet>
                    <h:outputText value="#{user.roles}" />
                </h:column>
                <h:column>
                    <f:facet name="header">Assign Role</f:facet>
                    <h:form>
                        <h:selectOneMenu id="role" value="#{adminUsersBean.selectedRole}">
                            <f:selectItems value="#{adminUsersBean.availableRoles}" />
                        </h:selectOneMenu>
                        <h:commandButton value="Assign"
                                         action="#{adminUsersBean.assignRole(user, adminUsersBean.selectedRole)}"
                                         styleClass="button button-secondary" />
                    </h:form>
                </h:column>
            </h:dataTable>
            <p rendered="#{empty adminUsersBean.users}">No users match your filter.</p>

            <h:form rendered="#{not empty adminUsersBean.users}" styleClass="pagination">
                <h:commandButton value="Previous" action="#{adminUsersBean.previousPage}"
                                 disabled="#{not adminUsersBean.hasPreviousPage()}"
                                 styleClass="button button-secondary" />
                <span>Page #{adminUsersBean.page + 1} of #{adminUsersBean.totalElements} users</span>
                <h:commandButton value="Next" action="#{adminUsersBean.nextPage}"
                                 disabled="#{not adminUsersBean.hasNextPage()}"
                                 styleClass="button" />
            </h:form>
        </div>
    </ui:define>
</ui:composition>
