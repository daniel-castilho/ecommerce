<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:my="https://loja.com/design-system"
                template="/WEB-INF/templates/main.xhtml">

    <ui:define name="title">Reset Password</ui:define>

    <ui:define name="content">
        <h1 class="page-title">Reset Password</h1>

        <div class="card">
            <h:form>
                <h:messages showDetail="true" showSummary="false" styleClass="messages" />

                <my:formFieldGroup label="Email" forId="email">
                    <h:inputText id="email" value="#{passwordResetBean.email}" required="true" />
                </my:formFieldGroup>

                <h:commandButton value="Send Reset Link" action="#{passwordResetBean.requestReset}"
                                 styleClass="button" />

                <p>
                    <h:outputLink value="/user-account/login.xhtml">Back to sign in</h:outputLink>
                </p>
            </h:form>
        </div>
    </ui:define>
</ui:composition>
