<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
  <h:head>
    <title>Reset Password</title>
  </h:head>
  <h:body>
    <h2>Reset Password</h2>
    <h:form>
      <h:messages styleClass="error" showDetail="true" showSummary="false" />
      <h:panelGrid columns="2">
        <h:outputLabel for="email" value="Email" />
        <h:inputText id="email" value="#{passwordResetBean.email}" required="true" />
      </h:panelGrid>
      <h:commandButton value="Send Reset Link" action="#{passwordResetBean.requestReset}" />
      <h:outputLink value="/user-account/login.xhtml"> Back to sign in</h:outputLink>
    </h:form>
  </h:body>
</html>
