<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:my="https://loja.com/design-system"
                template="/WEB-INF/templates/main.xhtml">

    <ui:define name="title">Choose New Password</ui:define>

    <ui:define name="content">
        <h1 class="page-title">Choose a New Password</h1>

        <div class="card">
            <h:form>
                <h:inputHidden value="#{passwordResetBean.token}" />
                <h:messages showDetail="true" showSummary="false" styleClass="messages" />

                <my:formFieldGroup label="New Password" forId="newPassword">
                    <h:inputSecret id="newPassword" value="#{passwordResetBean.newPassword}" required="true" />
                </my:formFieldGroup>

                <h:commandButton value="Set New Password" action="#{passwordResetBean.resetPassword}"
                                 styleClass="button" />

                <p>
                    <h:outputLink value="/user-account/login.xhtml">Back to sign in</h:outputLink>
                </p>
            </h:form>
        </div>
    </ui:define>
</ui:composition>
