<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
  <h:head>
    <title>Choose New Password</title>
  </h:head>
  <h:body>
    <h2>Choose a New Password</h2>
    <h:form>
      <h:inputHidden value="#{passwordResetBean.token}" />
      <h:messages styleClass="error" showDetail="true" showSummary="false" />
      <h:panelGrid columns="2">
        <h:outputLabel for="newPassword" value="New Password" />
        <h:inputSecret id="newPassword" value="#{passwordResetBean.newPassword}" required="true" />
      </h:panelGrid>
      <h:commandButton value="Set New Password" action="#{passwordResetBean.resetPassword}" />
      <h:outputLink value="/user-account/login.xhtml"> Back to sign in</h:outputLink>
    </h:form>
  </h:body>
</html>
