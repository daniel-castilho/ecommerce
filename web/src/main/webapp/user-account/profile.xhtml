<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:my="https://loja.com/design-system"
                template="/WEB-INF/templates/main.xhtml">

    <ui:define name="title">My Profile</ui:define>

    <ui:define name="content">
        <h1 class="page-title">My Profile</h1>

        <p>
            Signed in as #{userBean.currentUser.email.value}.
            <h:outputLink value="/user-account/profile.xhtml">Profile</h:outputLink> |
            <h:outputLink value="/user-account/address-book.xhtml">Address Book</h:outputLink> |
            <h:outputLink value="/user-account/admin/users.xhtml" rendered="#{userBean.hasRole('ADMIN')}">Admin</h:outputLink> |
            <h:form>
                <h:commandLink value="Logout" action="#{loginBean.logout}" />
            </h:form>
        </p>

        <h:messages showDetail="true" showSummary="false" styleClass="messages" />

        <div class="card">
            <h2>Personal Information</h2>
            <h:form>
                <my:formFieldGroup label="Full Name" forId="fullName">
                    <h:inputText id="fullName" value="#{profileBean.fullName}" required="true" />
                </my:formFieldGroup>
                <h:commandButton value="Save" action="#{profileBean.saveProfile}" styleClass="button" />
            </h:form>
        </div>

        <div class="card">
            <h2>Change Password</h2>
            <h:form>
                <my:formFieldGroup label="Current Password" forId="currentPassword">
                    <h:inputSecret id="currentPassword" value="#{profileBean.currentPassword}" required="true" />
                </my:formFieldGroup>

                <my:formFieldGroup label="New Password" forId="newPassword">
                    <h:inputSecret id="newPassword" value="#{profileBean.newPassword}" required="true" />
                </my:formFieldGroup>

                <h:commandButton value="Change Password" action="#{profileBean.changePassword}"
                                 styleClass="button" />
            </h:form>
        </div>
    </ui:define>
</ui:composition>
