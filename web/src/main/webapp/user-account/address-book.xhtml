<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:my="https://loja.com/design-system"
                template="/WEB-INF/templates/main.xhtml">

    <ui:define name="title">Address Book</ui:define>

    <ui:define name="content">
        <h1 class="page-title">Address Book</h1>
        <h:messages showDetail="true" showSummary="false" styleClass="messages" />

        <div class="card">
            <h2>Saved Addresses</h2>
            <h:dataTable value="#{addressBookBean.addresses}" var="address"
                         styleClass="data-table"
                         rendered="#{not empty addressBookBean.addresses}">
                <h:column>
                    <f:facet name="header">Street</f:facet>
                    #{address.street}, #{address.number}
                </h:column>
                <h:column>
                    <f:facet name="header">City / State</f:facet>
                    #{address.city} - #{address.state}
                </h:column>
                <h:column>
                    <f:facet name="header">Postal Code</f:facet>
                    #{address.postalCode}
                </h:column>
                <h:column>
                    <f:facet name="header">Label</f:facet>
                    #{address.label}
                </h:column>
                <h:column>
                    <f:facet name="header">Default</f:facet>
                    #{address['default'] ? 'Yes' : 'No'}
                </h:column>
                <h:column>
                    <f:facet name="header">Actions</f:facet>
                    <h:form>
                        <h:commandButton value="Set as Default"
                                         action="#{addressBookBean.setDefault(address.id)}"
                                         rendered="#{not address['default']}"
                                         styleClass="button button-secondary" />
                        <h:commandButton value="Remove"
                                         action="#{addressBookBean.deleteAddress(address.id)}"
                                         styleClass="button button-secondary" />
                    </h:form>
                </h:column>
            </h:dataTable>
            <p rendered="#{empty addressBookBean.addresses}">No addresses saved yet.</p>
        </div>

        <div class="card">
            <h2>Add New Address</h2>
            <h:form>
                <my:formFieldGroup label="Street" forId="street">
                    <h:inputText id="street" value="#{addressBookBean.street}" required="true" />
                </my:formFieldGroup>

                <my:formFieldGroup label="Number" forId="number">
                    <h:inputText id="number" value="#{addressBookBean.number}" required="true" />
                </my:formFieldGroup>

                <my:formFieldGroup label="Complement" forId="complement">
                    <h:inputText id="complement" value="#{addressBookBean.complement}" />
                </my:formFieldGroup>

                <my:formFieldGroup label="Neighborhood" forId="neighborhood">
                    <h:inputText id="neighborhood" value="#{addressBookBean.neighborhood}" />
                </my:formFieldGroup>

                <my:formFieldGroup label="City" forId="city">
                    <h:inputText id="city" value="#{addressBookBean.city}" required="true" />
                </my:formFieldGroup>

                <my:formFieldGroup label="State" forId="state">
                    <h:inputText id="state" value="#{addressBookBean.state}" required="true" />
                </my:formFieldGroup>

                <my:formFieldGroup label="Postal Code" forId="postalCode">
                    <h:inputText id="postalCode" value="#{addressBookBean.postalCode}" required="true" />
                </my:formFieldGroup>

                <my:formFieldGroup label="Label (e.g. Home, Work)" forId="label">
                    <h:inputText id="label" value="#{addressBookBean.label}" />
                </my:formFieldGroup>

                <my:formFieldGroup label="Set as default" forId="setAsDefault">
                    <h:selectBooleanCheckbox id="setAsDefault" value="#{addressBookBean.setAsDefault}" />
                </my:formFieldGroup>

                <h:commandButton value="Add Address" action="#{addressBookBean.addAddress}"
                                 styleClass="button" />
            </h:form>
        </div>
    </ui:define>
</ui:composition>
