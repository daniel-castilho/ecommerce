<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:my="https://loja.com/design-system"
                template="/WEB-INF/templates/main.xhtml">

    <ui:define name="title">Register</ui:define>

    <ui:define name="content">
        <h1 class="page-title">Create Account</h1>

        <div class="card">
            <h:form>
                <h:messages showDetail="true" showSummary="false" styleClass="messages" />

                <my:formFieldGroup label="Email" for="email">
                    <h:inputText id="email" value="#{registerBean.email}" required="true" />
                </my:formFieldGroup>

                <my:formFieldGroup label="Full Name" for="fullName">
                    <h:inputText id="fullName" value="#{registerBean.fullName}" required="true" />
                </my:formFieldGroup>

                <my:formFieldGroup label="Password" for="password">
                    <h:inputSecret id="password" value="#{registerBean.password}" required="true" />
                </my:formFieldGroup>

                <h:commandButton value="Register" action="#{registerBean.register}" styleClass="button" />

                <p>
                    <h:outputLink value="/user-account/login.xhtml">Already have an account? Sign in</h:outputLink>
                </p>
            </h:form>
        </div>
    </ui:define>
</ui:composition>
