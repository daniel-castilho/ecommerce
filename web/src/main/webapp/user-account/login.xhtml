<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:my="https://loja.com/design-system"
                template="/WEB-INF/templates/main.xhtml">

    <ui:define name="title">Login</ui:define>

    <ui:define name="content">
        <h1 class="page-title">Sign In</h1>

        <div class="card">
            <h:form>
                <h:messages showDetail="true" showSummary="false" styleClass="messages" />

                <my:formFieldGroup label="Email" forId="email">
                    <h:inputText id="email" value="#{loginBean.email}" required="true" />
                </my:formFieldGroup>

                <my:formFieldGroup label="Password" forId="password">
                    <h:inputSecret id="password" value="#{loginBean.password}" required="true" />
                </my:formFieldGroup>

                <h:commandButton value="Sign In" action="#{loginBean.login}" styleClass="button" />

                <p>
                    <h:outputLink value="/user-account/register.xhtml">Don't have an account? Register</h:outputLink><br />
                    <h:outputLink value="/user-account/password-reset.xhtml">Forgot your password?</h:outputLink>
                </p>
            </h:form>
        </div>
    </ui:define>
</ui:composition>
