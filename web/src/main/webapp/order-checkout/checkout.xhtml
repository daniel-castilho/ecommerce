<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/templates/main.xhtml">

    <ui:define name="title">Checkout</ui:define>

    <ui:define name="content">
        <h1 class="page-title">Checkout</h1>
        <h:messages showDetail="true" showSummary="false" styleClass="messages" />

        <div class="card">
            <h:outputText value="You need to log in before placing an order."
                          rendered="#{not userBean.isLoggedIn()}" />

            <h:form rendered="#{userBean.isLoggedIn()}">
                <h:dataTable value="#{checkoutBean.cartLines}" var="line" styleClass="data-table">
                    <h:column>
                        <f:facet name="header">Product ID</f:facet>
                        <h:inputText value="#{line.productId}" />
                    </h:column>
                    <h:column>
                        <f:facet name="header">Quantity</f:facet>
                        <h:inputText value="#{line.quantity}" />
                    </h:column>
                    <h:column>
                        <f:facet name="header">Remove</f:facet>
                        <h:commandButton value="Remove" action="#{checkoutBean.removeLine(line)}"
                                         styleClass="button button-secondary" />
                    </h:column>
                </h:dataTable>

                <h:commandButton value="Add product" action="#{checkoutBean.addLine}"
                                 styleClass="button button-secondary" />
                <h:commandButton value="Place order" action="#{checkoutBean.checkout}"
                                 styleClass="button" />
            </h:form>
        </div>

        <p><h:link outcome="/product-catalog/catalog" value="Back to catalog" /></p>
    </ui:define>
</ui:composition>
