<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/templates/main.xhtml">

    <ui:define name="title">Product Catalog</ui:define>

    <ui:define name="content">
        <h1 class="page-title">Our Products</h1>
        <h:messages globalOnly="true" styleClass="messages" />

        <div class="card">
            <h:form id="filterForm">
                <div class="form-grid">
                    <h:outputLabel for="search" value="Search" />
                    <h:inputText id="search" value="#{productCatalogBean.searchTerm}" />

                    <h:outputLabel for="category" value="Category" />
                    <h:selectOneMenu id="category" value="#{productCatalogBean.categoryId}">
                        <f:selectItem itemValue="#{null}" itemLabel="All categories" />
                        <f:selectItems value="#{productCatalogBean.categories}" var="c"
                                       itemValue="#{c.id}" itemLabel="#{c.name}" />
                    </h:selectOneMenu>

                    <h:outputLabel for="minPrice" value="Min price" />
                    <h:inputText id="minPrice" value="#{productCatalogBean.minPrice}" />

                    <h:outputLabel for="maxPrice" value="Max price" />
                    <h:inputText id="maxPrice" value="#{productCatalogBean.maxPrice}" />

                    <h:outputLabel for="sortField" value="Sort by" />
                    <h:selectOneMenu id="sortField" value="#{productCatalogBean.sortField}">
                        <f:selectItems value="#{productCatalogBean.availableSortFields}" />
                    </h:selectOneMenu>

                    <h:outputLabel for="sortDirection" value="Direction" />
                    <h:selectOneMenu id="sortDirection" value="#{productCatalogBean.sortDirection}">
                        <f:selectItems value="#{productCatalogBean.availableSortDirections}" />
                    </h:selectOneMenu>
                </div>
                <h:commandButton value="Search" action="#{productCatalogBean.search}"
                                 styleClass="button" />
            </h:form>
        </div>

        <ui:fragment rendered="#{not empty productCatalogBean.results}">
            <div class="product-grid">
                <ui:repeat value="#{productCatalogBean.results}" var="product">
                    <div class="product-card">
                        <h:graphicImage value="#{productCatalogBean.primaryImageUrl(product)}"
                                        alt="#{productCatalogBean.primaryImageAlt(product)}"
                                        rendered="#{not empty productCatalogBean.primaryImageUrl(product)}"
                                        styleClass="product-card-image" />
                        <div class="product-card-body">
                            <div class="product-card-title-row">
                                <span class="product-card-name">
                                    <h:link outcome="/product-catalog/product-detail.xhtml"
                                            value="#{product.name}">
                                        <f:param name="slug" value="#{product.slugValue}" />
                                    </h:link>
                                </span>
                                <h:form>
                                    <h:commandButton value="&#9829;"
                                                     title="Remove from wishlist"
                                                     styleClass="wishlist-heart active"
                                                     rendered="#{wishlistBean.loggedIn and wishlistBean.inWishlistFor(product.id)}"
                                                     action="#{wishlistBean.toggleFor(product.id)}" />
                                    <h:commandButton value="&#9825;"
                                                     title="Add to wishlist"
                                                     styleClass="wishlist-heart"
                                                     rendered="#{wishlistBean.loggedIn and not wishlistBean.inWishlistFor(product.id)}"
                                                     action="#{wishlistBean.toggleFor(product.id)}" />
                                    <h:link outcome="/user-account/login.xhtml"
                                            title="Log in to save"
                                            styleClass="wishlist-heart"
                                            rendered="#{not wishlistBean.loggedIn}">&#9825;</h:link>
                                </h:form>
                            </div>
                            <span class="product-card-sku">#{product.skuValue}</span>
                            <span class="product-card-price">$#{product.price.amount}</span>
                            <span class="product-card-desc">#{product.shortDescription}</span>
                            <h:form>
                                <h:commandButton value="Add to cart"
                                                 styleClass="button button-secondary"
                                                 rendered="#{product.status eq 'ACTIVE' and product.stock gt 0}"
                                                 action="#{cartBean.addProduct(product.id)}" />
                            </h:form>
                            <h:link outcome="/product-catalog/product-detail.xhtml"
                                    value="View details" styleClass="button">
                                <f:param name="slug" value="#{product.slugValue}" />
                            </h:link>
                        </div>
                    </div>
                </ui:repeat>
            </div>

            <h:form id="resultForm" styleClass="pagination">
                <h:commandButton value="Previous" action="#{productCatalogBean.previousPage}"
                                 disabled="#{not productCatalogBean.hasPreviousPage()}"
                                 styleClass="button button-secondary" />
                <span>Page #{productCatalogBean.page + 1} of #{productCatalogBean.totalPages}
                      (#{productCatalogBean.totalElements} products)</span>
                <h:commandButton value="Next" action="#{productCatalogBean.nextPage}"
                                 disabled="#{not productCatalogBean.hasNextPage()}"
                                 styleClass="button" />
            </h:form>
        </ui:fragment>

        <ui:fragment rendered="#{empty productCatalogBean.results}">
          <p>No products match your search.</p>
        </ui:fragment>
    </ui:define>
</ui:composition>
