<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:my="https://loja.com/design-system"
                template="/WEB-INF/templates/main.xhtml">

    <ui:define name="title">Admin - Audit Logs</ui:define>

    <ui:define name="content">
        <h:messages globalOnly="true" styleClass="messages" />
        
        <ui:fragment rendered="#{not userBean.hasRole('ADMIN')}">
            <div class="card">
                <p>Access denied. This page requires the ADMIN role.</p>
                <h:link outcome="/product-catalog/catalog.xhtml" value="Back to catalog" styleClass="button" />
            </div>
        </ui:fragment>
        
        <ui:fragment rendered="#{userBean.hasRole('ADMIN')}">
            <h1 class="page-title">Audit Logs</h1>

            <div class="card">
                <h:dataTable value="#{auditLogBean.logs}" var="log"
                             styleClass="data-table" rendered="#{not empty auditLogBean.logs}">
                    <h:column>
                        <f:facet name="header">ID</f:facet>
                        #{log.id}
                    </h:column>
                    <h:column>
                        <f:facet name="header">Event Type</f:facet>
                        <h:outputText value="#{log.eventType}" style="font-weight: bold;" />
                    </h:column>
                    <h:column>
                        <f:facet name="header">User ID</f:facet>
                        #{log.userId}
                    </h:column>
                    <h:column>
                        <f:facet name="header">Actor ID</f:facet>
                        #{log.actorId}
                    </h:column>
                    <h:column>
                        <f:facet name="header">Date</f:facet>
                        <h:outputText value="#{log.createdAt}">
                            <f:convertDateTime type="both" timeZone="UTC" />
                        </h:outputText>
                    </h:column>
                    <h:column>
                        <f:facet name="header">IP Address</f:facet>
                        #{log.ipAddress}
                    </h:column>
                    <h:column>
                        <f:facet name="header">Details</f:facet>
                        #{log.details}
                    </h:column>
                </h:dataTable>
                <p rendered="#{empty auditLogBean.logs}">No audit logs found.</p>
                
                <h:form rendered="#{not empty auditLogBean.logs}" styleClass="pagination">
                    <h:commandButton value="Previous" action="#{auditLogBean.previousPage}"
                                     disabled="#{not auditLogBean.hasPreviousPage()}"
                                     styleClass="button button-secondary" />
                    <span>Page #{auditLogBean.page + 1}</span>
                    <h:commandButton value="Next" action="#{auditLogBean.nextPage}"
                                     disabled="#{not auditLogBean.hasNextPage()}"
                                     styleClass="button" />
                </h:form>
            </div>
        </ui:fragment>
    </ui:define>
</ui:composition>
