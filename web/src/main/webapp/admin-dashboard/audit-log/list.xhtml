<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:my="https://loja.com/design-system"
                template="/WEB-INF/templates/main.xhtml">

    <ui:define name="title">Admin - Audit Logs</ui:define>

    <ui:define name="content">
        <h:messages globalOnly="true" styleClass="messages" />
        
        <ui:fragment rendered="#{not userBean.hasRole('ADMIN')}">
            <div class="card">
                <p>Access denied. This page requires the ADMIN role.</p>
                <h:link outcome="/product-catalog/catalog.xhtml" value="Back to catalog" styleClass="button" />
            </div>
        </ui:fragment>
        
        <ui:fragment rendered="#{userBean.hasRole('ADMIN')}">
            <h1 class="page-title">Audit Logs</h1>

            <div class="card">
                <h:form id="filtersForm">
                    <div class="form-grid">
                        <my:formFieldGroup label="Actor ID" forId="actorFilterId">
                            <h:inputText id="actorFilterId" value="#{auditLogBean.actorFilter}"
                                         placeholder="e.g. admin@loja.com" />
                        </my:formFieldGroup>

                        <my:formFieldGroup label="Event Type" forId="eventTypeId">
                            <h:selectOneMenu id="eventTypeId" value="#{auditLogBean.eventTypeFilter}">
                                <f:selectItem itemValue="#{null}" itemLabel="All event types" />
                                <f:selectItems value="#{auditLogBean.eventTypes}" />
                            </h:selectOneMenu>
                        </my:formFieldGroup>

                        <my:formFieldGroup label="Details contains" forId="detailsFilterId">
                            <h:inputText id="detailsFilterId" value="#{auditLogBean.detailsFilter}" />
                        </my:formFieldGroup>

                        <my:formFieldGroup label="From date" forId="fromDateId">
                            <h:inputText id="fromDateId" value="#{auditLogBean.fromDate}">
                                <f:convertDateTime type="localDate" pattern="yyyy-MM-dd" />
                            </h:inputText>
                        </my:formFieldGroup>

                        <my:formFieldGroup label="To date" forId="toDateId">
                            <h:inputText id="toDateId" value="#{auditLogBean.toDate}">
                                <f:convertDateTime type="localDate" pattern="yyyy-MM-dd" />
                            </h:inputText>
                        </my:formFieldGroup>

                        <div class="form-actions">
                            <h:commandButton value="Search" action="#{auditLogBean.search}"
                                             styleClass="button button-primary" />
                            <h:commandButton value="Reset" action="#{auditLogBean.resetFilters}"
                                             styleClass="button button-secondary" />
                        </div>
                    </div>
                </h:form>
            </div>

            <div class="card">
                <h:dataTable value="#{auditLogBean.logs}" var="log"
                             styleClass="data-table" rendered="#{not empty auditLogBean.logs}">
                    <h:column>
                        <f:facet name="header">ID</f:facet>
                        #{log.id}
                    </h:column>
                    <h:column>
                        <f:facet name="header">Event Type</f:facet>
                        <h:outputText value="#{log.eventType}" style="font-weight: bold;" />
                    </h:column>
                    <h:column>
                        <f:facet name="header">User ID</f:facet>
                        #{log.userId}
                    </h:column>
                    <h:column>
                        <f:facet name="header">Actor ID</f:facet>
                        #{log.actorId}
                    </h:column>
                    <h:column>
                        <f:facet name="header">Date</f:facet>
                        <h:outputText value="#{auditLogBean.logDate(log)}">
                            <f:convertDateTime type="localDateTime" pattern="yyyy-MM-dd HH:mm:ss" timeZone="UTC" />
                        </h:outputText>
                    </h:column>
                    <h:column>
                        <f:facet name="header">IP Address</f:facet>
                        #{log.ipAddress}
                    </h:column>
                    <h:column>
                        <f:facet name="header">Details</f:facet>
                        <h:outputText value="#{auditLogBean.displayDetails(log)}"
                                      title="#{auditLogBean.isTruncated(log) ? auditLogBean.fullDetails(log) : ''}" />
                    </h:column>
                </h:dataTable>
                <ui:fragment rendered="#{empty auditLogBean.logs}">
                    <p>No audit logs found.</p>
                </ui:fragment>
                
                <h:form rendered="#{not empty auditLogBean.logs}" styleClass="pagination">
                    <h:commandButton value="Previous" action="#{auditLogBean.previousPage}"
                                     disabled="#{not auditLogBean.hasPreviousPage()}"
                                     styleClass="button button-secondary" />
                    <span>Page #{auditLogBean.page + 1}</span>
                    <h:commandButton value="Next" action="#{auditLogBean.nextPage}"
                                     disabled="#{not auditLogBean.hasNextPage()}"
                                     styleClass="button" />
                </h:form>
            </div>
        </ui:fragment>
    </ui:define>
</ui:composition>
